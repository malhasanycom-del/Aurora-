name: Al-Rashid TV Android APK
on:
  push:
    branches: [main, aurora-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Validate and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12.0
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: node --check scripts/prepare-android.js && node --check scripts/patch-android.js && node --check scripts/native-http-entry.js
      - name: Validate source
        run: npm run validate
      - name: Bundle HLS library
        run: npm run prepare:android
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure Android network security for IPTV HTTP sources
        run: npm run patch:android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Report APK size
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          stat -c "APK_BYTES=%s" "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: al-rashid-tv-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
